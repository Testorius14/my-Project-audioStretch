<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Newtone avanzado</title>
  <style>
    #waveform {
      border: 1px solid black;
      width: 600px;
      height: 150px;
      cursor: crosshair;
    }
    #timeline {
      border: 1px solid #333;
      width: 600px;
      height: 200px;
      margin-top: 20px;
      position: relative;
    }
    .clip {
      position: absolute;
      background: rgba(0, 150, 255, 0.5);
      border: 1px solid #007;
      padding: 5px;
      cursor: move;
    }
    .controls {
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h2>🎶 Prototipo estilo Newtone avanzado</h2>
  <input type="file" id="fileInput" accept="audio/*"><br><br>
  <canvas id="waveform"></canvas>
  <div id="timeline"></div>
  <button id="playAllBtn">▶️ Reproducir todos los clips</button>

  <script src="newtone_advanced.js"></script>
</body>
</html>
